services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  warm_joern:
    build:
      context: .
      dockerfile: warm_joern/Dockerfile
      args:
        JOERN_VERSION: v4.0.515
    command: python -m uvicorn warm_joern.main:app --host 0.0.0.0 --port 7070
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      JOERN_BIN: /opt/joern/joern-cli/joern
      JOERN_SCRIPT: /app/warm_joern/scripts/export_cfg.sc
      HARD_TIMEOUT_SECONDS: "120"

  api:
    build: .
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WARM_JOERN_URL: ${WARM_JOERN_URL:-http://warm_joern:7070}
      HARD_TIMEOUT_SECONDS: ${HARD_TIMEOUT_SECONDS:-120}
      QUEUE_JOB_TIMEOUT_SECONDS: ${QUEUE_JOB_TIMEOUT_SECONDS:-180}
      REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-3600}
      QUEUE_NAME: ${QUEUE_NAME:-cfg}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_healthy
      warm_joern:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WARM_JOERN_URL: ${WARM_JOERN_URL:-http://warm_joern:7070}
      HARD_TIMEOUT_SECONDS: ${HARD_TIMEOUT_SECONDS:-120}
      QUEUE_JOB_TIMEOUT_SECONDS: ${QUEUE_JOB_TIMEOUT_SECONDS:-180}
      REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-3600}
      QUEUE_NAME: ${QUEUE_NAME:-cfg}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_healthy
      warm_joern:
        condition: service_healthy
